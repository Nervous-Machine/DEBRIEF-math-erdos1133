# Pre-registration, cycle "rerun-2026-11-27": independent rerun of a third-party Lean formalization of Erdős 1133.
# Written 2026-11-27T02:15Z, BEFORE any build or check below ran. Tooling installation in the VM (elan toolchain, Mathlib cache
# download) is not a check and may precede the checks. Amendments go below a marker line; this body is never edited.
#
# Occasion. The record's first gap (EG1) says no formal deduction exists for the claimed proof. On 2026-11-26, while
# scanning targets for DEBRIEF-math-rooms build 6, the registrar found a complete Lean formalization of the Erdős 1133
# statement: github.com/peilinliu66-dev/jsp940-erdos1133-formalization at commit 83ab7d38a4abbdfc1c9509cfbb7b49514cca217e
# (one commit, 2026-09-28, Apache-2.0, "with Codex AI assistance"), ingested into competemath/tengoku on 2026-11-20 as
# 325 theorems. Its README says the endpoint Erdos1133.erdos_1133 passed local checking on 2026-09-28 on the standard
# three axioms, and that its sources are Yang's manuscript (the artifact this record pins), an unsigned ulam.ai draft of
# 2026-04-29, and Olevskii–Ulanovskii (2018). The formalizer is not the claimant. This cycle reruns it here.
#
# What a pass means and does not mean. A pass shows that the formal-conjectures statement of Erdős 1133 has a kernel-
# checked proof on the standard axioms, rerun by a party independent of both the claimant and the formalizer. It does
# not show that Yang's written proof is correct, or that the formalization follows Yang's route: the formalizer names
# two written sources and its own analytic route. EG1 asks for a formal deduction of the main theorem with a third-party
# statement; the statement here is formal-conjectures', which is third-party. EG2 (a human reading of Yang's proof) is
# untouched by this cycle.

